<!--  Tidio Styling-->
  <style>
  /* --- FIX 1: UNBLOCK THE PAGE (The Inert Fix) --- */
  #tidio-chat {
    /* Allows clicks to pass through the full-screen container */
    pointer-events: none !important; 
    z-index: 999999 !important;
    max-height: 100vh;
  }

  /* --- FIX 2: RE-ENABLE CLICKS ON CHAT WINDOW --- */
  /* Only the actual Chat Window (iframe) should catch clicks */
  #tidio-chat iframe, 
  #tidio-chat div[id^="tidio-chat-iframe"],
  iframe[title="Tidio Chat"] {
    pointer-events: auto !important;
  }

  /* --- FIX 3: HIDE DEFAULT TIDIO ROUND BUTTON (The 3-Widget Fix) --- */
  /* This forces the default button to disappear so only your Tree Icon shows */
  #tidio-chat-button, 
  #tidio-chat iframe[name="tidio-chat-button"],
  #tidio-chat iframe[data-testid="widgetButton"],
  .tidio-chat-widget-button {
    display: none !important;
    pointer-events: none !important;
    width: 0 !important;
    height: 0 !important;
  }

  /* --- POSITIONING FOR THE OPEN CHAT WINDOW --- */
  #tidio-chat-iframe, 
  #tidio-chat iframe[name="tidio-chat-iframe"],
  iframe[id^="tidio-chat"] {
    bottom: 60px !important;
    left: 0px !important;
    right: auto !important;
    transform: none !important;
    z-index: 999999 !important;
  }

  /* Mobile adjustments */
  @media only screen and (max-width: 767px) {
    #tidio-chat-iframe, 
    #tidio-chat iframe[name="tidio-chat-iframe"],
    iframe[id^="tidio-chat"] {
      bottom: 58px !important;
      left: 2px !important;
    }
  }
  
  /* --- CUSTOM TREE BUTTON POSITIONING --- */
  #custom-tidio-button {
    bottom: 60px !important;
    left: 0px !important;
  }
  
  @media only screen and (max-width: 767px) {
    #custom-tidio-button {
      bottom: 58px !important;
      left: 2px !important;
    }
  }
  
  /* Ensure Typebot bubble doesn't get hidden */
  div[part="preview-message"] {
    z-index: 100000 !important;
  }
</style>

<script>
  // Global interval reference
  let tidioPositioningInterval;
  
  // Function to fix Tidio positioning by applying styles directly to elements
  function enforceTidioPositioning() {
    const isMobile = window.innerWidth <= 767;
    const bottomPosition = isMobile ? '58px' : '60px';
    const leftPosition = isMobile ? '2px' : '0px';
    
    // Target ALL iframes
    const allIframes = document.querySelectorAll('iframe');
    allIframes.forEach(frame => {
      const frameId = frame.id || '';
      const frameName = frame.name || '';
      
      // Match Tidio iframes
      if (frameId.includes('tidio') || frameName.includes('tidio') || frame.src?.includes('tidio')) {
        
        // HIDE the default button iframe aggressively
        if(frameId.includes('button') || frameName.includes('button')) {
            frame.style.setProperty('display', 'none', 'important');
            return; 
        }

        // POSITION the chat window iframe
        frame.style.setProperty('bottom', bottomPosition, 'important');
        frame.style.setProperty('left', leftPosition, 'important');
        frame.style.setProperty('right', 'auto', 'important');
        frame.style.setProperty('transform', 'none', 'important');
        frame.style.setProperty('z-index', '999999', 'important');
        frame.style.setProperty('pointer-events', 'auto', 'important'); // Ensure chat is clickable
        
        // PREVENT CONTAINER from blocking clicks
        let parent = frame.parentElement;
        if (parent && (parent.id === 'tidio-chat' || parent.id.includes('tidio'))) {
            parent.style.setProperty('pointer-events', 'none', 'important');
            parent.style.setProperty('z-index', '999999', 'important');
        }
      }
    });
    
    // Position Custom Button
    const customButton = document.getElementById('custom-tidio-button');
    if (customButton) {
      customButton.style.setProperty('bottom', bottomPosition, 'important');
      customButton.style.setProperty('left', leftPosition, 'important');
    }
  }
  
  // Increase the enforcement frequency
  function startAggressivePositioning() {
    if (tidioPositioningInterval) clearInterval(tidioPositioningInterval);
    enforceTidioPositioning();
    setTimeout(() => enforceTidioPositioning(), 100);
    setTimeout(() => enforceTidioPositioning(), 500);
    tidioPositioningInterval = setInterval(enforceTidioPositioning, 1000);
  }
  
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', startAggressivePositioning);
  } else {
    startAggressivePositioning();
  }
  
  window.addEventListener('load', enforceTidioPositioning);
  window.addEventListener('resize', function() { setTimeout(enforceTidioPositioning, 200); });
  
  // Hook into Tidio API
  function hookTidioAPI() {
    if (window.tidioChatApi) {
      if (typeof window.tidioChatApi.on === 'function') {
        window.tidioChatApi.on('open', enforceTidioPositioning);
        window.tidioChatApi.on('close', enforceTidioPositioning);
      }
    } else {
      setTimeout(hookTidioAPI, 1000);
    }
  }
  hookTidioAPI();
</script>

<!-- Live chat Tidio -->
 <script>
document.addEventListener('DOMContentLoaded', function() {
  // When openTidioChat is called, it no longer sets pointer-events: auto on the container (which was breaking links).
  // It ensures the container is visible, but "transparent" to clicks.
  
  // Detect if we're on mobile
  const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
  console.log('Device detected:', isMobile ? 'Mobile' : 'Desktop');
  
  let chatJustClosed = false;
  
  // Function to open Tidio chat
  function openTidioChat(e) {
    if (chatJustClosed) return false;
    
    // Prevent default action
    if(e) {
        e.preventDefault();
        e.stopPropagation();
    }
    console.log('Chat button clicked');
    
    // --- CRITICAL FIX: Handle Container Visibility safely ---
    const tidioElements = document.querySelectorAll('#tidio-chat');
    tidioElements.forEach(function(el) {
      if (el) {
        el.style.opacity = '1';
        el.style.display = 'block';
        el.style.zIndex = '9999999999';
        el.style.pointerEvents = 'none'; // FIX: Don't block the page
      }
    });

    // Hide custom button immediately to prevent duplication
    const customBtn = document.getElementById('custom-tidio-button');
    if(customBtn) customBtn.style.display = 'none';
    
    // Use Tidio API
    if (window.tidioChatApi) {
      if (typeof window.tidioChatApi.track === 'function') window.tidioChatApi.track('livechat_handoff_triggered');
      
      // Force open
      if (typeof window.tidioChatApi.open === 'function') {
        window.tidioChatApi.open();
      }
      // Ensure it shows
      if (typeof window.tidioChatApi.show === 'function') {
        window.tidioChatApi.show();
      }
    }
    
    return false;
  }
  
  // Setup Close Listeners
  function setupTidioEventListeners() {
    if (window.tidioChatApi) {
      window.tidioChatApi.on('close', function() {
        chatJustClosed = true;
        setTimeout(function() { chatJustClosed = false; }, 1000);
        
        // Re-show custom button when chat closes
        const customBtn = document.getElementById('custom-tidio-button');
        if(customBtn) setTimeout(() => { customBtn.style.display = 'block'; }, 300);
      });
    } else {
      setTimeout(setupTidioEventListeners, 1000);
    }
  }
  setupTidioEventListeners();
  
  // --- CLICK HANDLERS FOR SITE BUTTONS ---
  
  // Desktop Buttons
  const desktopButtons = document.querySelectorAll('.deskctaclick');
  desktopButtons.forEach(function(button) {
    if (button.classList.contains('deskorderclick') || button.classList.contains('deskdemoclick') || button.classList.contains('deskcallclick')) return;
    
    const links = button.querySelectorAll('a');
    links.forEach(function(link) {
      const href = link.getAttribute('href') || '';
      if (href.startsWith('tel:')) return;
      link.addEventListener('click', openTidioChat);
    });
  });
  
  // Mobile Elements
  const mobileElements = document.querySelectorAll('.mobctaclick, .cta-text, .cta-icon, .cta-flex');
  mobileElements.forEach(function(element) {
    let skip = false;
    const links = element.querySelectorAll('a');
    links.forEach(function(link) {
      const href = link.getAttribute('href') || '';
      if (href.startsWith('tel:') || href.includes('request-demo') || href.includes('/beds/')) skip = true;
    });
    if (skip) return;
    
    element.addEventListener('click', openTidioChat);
    links.forEach(function(link) {
      link.removeAttribute('onclick');
      link.addEventListener('click', openTidioChat);
    });
  });
  
  // Main CTA Bar
  const ctaBar = document.querySelector('.cta-bar');
  if (ctaBar) {
    let skip = false;
    const links = ctaBar.querySelectorAll('a');
    links.forEach(function(link) {
      const href = link.getAttribute('href') || '';
      if (href.startsWith('tel:') || href.includes('request-demo') || href.includes('/beds/')) skip = true;
    });
    if (!skip) {
      ctaBar.addEventListener('click', openTidioChat);
      ctaBar.style.cursor = 'pointer';
    }
  }
});
</script>

<script>
  // Global function: Trigger widget and manage custom button
  function triggerTidioWidget() {
    const tidioContainer = document.querySelector('#tidio-chat');
    if(tidioContainer) {
        tidioContainer.style.opacity = '1';
        tidioContainer.style.pointerEvents = 'none'; // Ensure page is clickable
        tidioContainer.style.zIndex = '9999999999';
    }
  
    // Ensure custom button is visible
    var customButton = document.getElementById('custom-tidio-button');
    if (customButton) {
      customButton.style.display = 'block';
    }
  }

  // Wait for API and setup listeners
  function waitForTidio(callback) {
    if (window.tidioChatApi && typeof window.tidioChatApi.open === 'function') {
      callback();
    } else {
      setTimeout(() => { waitForTidio(callback); }, 500);
    }
  }
  
  waitForTidio(() => {
    const customButton = document.getElementById('custom-tidio-button');
    
    // CLICK HANDLER: Hides button immediately, then opens chat
    if(customButton) {
        // Remove old listeners to be safe
        const newBtn = customButton.cloneNode(true);
        customButton.parentNode.replaceChild(newBtn, customButton);
        
        newBtn.addEventListener('click', function() {
            this.style.display = 'none'; // Hide immediately
            window.tidioChatApi.open();
        });
    }
    
    // API EVENTS
    window.tidioChatApi.on("open", function() {
      const btn = document.getElementById('custom-tidio-button');
      if(btn) btn.style.display = 'none';
    });
    
    window.tidioChatApi.on("close", function() {
      setTimeout(() => {
        const btn = document.getElementById('custom-tidio-button');
        if(btn) btn.style.display = 'block';
      }, 300);
    });
    
    // VISITOR NAME GENERATOR
    const zip = sessionStorage.getItem('zip') || '';
    const randomStr = Math.random().toString(36).substr(2, 6);
    if (typeof window.tidioChatApi.setVisitorData === 'function') {
        window.tidioChatApi.setVisitorData({ name: randomStr + '-' + zip });
    }
    
    // HANDOFF LOGIC
    if (sessionStorage.getItem('typebotHandoffInitiated') && !sessionStorage.getItem('prefilledMessageSent')) {
        window.tidioChatApi.open();
        setTimeout(() => {
            if (typeof window.tidioChatApi.messageFromVisitor === 'function') {
                 window.tidioChatApi.messageFromVisitor(`Connected to logistics - ${zip}`);
            }
            setTimeout(() => {
                if (typeof window.tidioChatApi.messageFromOperator === 'function') {
                    window.tidioChatApi.messageFromOperator("Hello! We have beds stocked near you and can deliver quickly if needed.");
                }
                sessionStorage.setItem('prefilledMessageSent', 'true');
            }, 2000);
        }, 1000);
    }
  });
</script>

<script>
  // TYPEBOT LOADER
  document.addEventListener('DOMContentLoaded', async () => {
    try {
      const TypebotModule = await import('https://cdn.jsdelivr.net/npm/@typebot.io/js@0.3/dist/web.js');
      const Typebot = TypebotModule.default;
      
      if (!sessionStorage.getItem('typebotHandoffCompleted')) {
        Typebot.initBubble({
          typebot: "zip-validator-tidio-q3t8pze",
          previewMessage: { message: "Need Quick Delivery?", autoShowDelay: 2000 },
          theme: {
            placement: "left",
            button: { backgroundColor: "#2a305c", customIconSrc: "https://s3.typebot.io/public/workspaces/cm6826b90000b683eotgw3ojv/typebots/cm6826lam0001wenuta4cr5hp/bubble-icon?v=1737574307473" },
            chatWindow: { backgroundColor: "#f7f7f7" }
          }
        });
      } else {
        triggerTidioWidget();
      }
      
      // Listen for HANDOFF
      window.addEventListener('message', function(event) {
        if (event.data && event.data.type === "TYPEBOT_HANDOFF") {
          if (window.Typebot) window.Typebot.close();
          
          sessionStorage.setItem('typebotHandoffCompleted', 'true');
          sessionStorage.setItem('typebotHandoffInitiated', 'true');
          
          triggerTidioWidget();
          if (window.tidioChatApi) {
              window.tidioChatApi.open();
              window.tidioChatApi.track('typebot_handoff_triggered');
          }
        }
      });
      
      // Style Bubble
      const bubbleInterval = setInterval(() => {
        const bubbleElement = document.querySelector('div[part="preview-message"]');
        if (bubbleElement) {
          bubbleElement.removeAttribute('style');
          bubbleElement.classList.add("bg-blue-950", "text-white", "rounded-lg", "shadow-md"); 
          clearInterval(bubbleInterval);
        }
      }, 100);
      setTimeout(() => clearInterval(bubbleInterval), 10000);
      
    } catch (error) { console.error("Error loading Typebot:", error); }
  });
</script>
